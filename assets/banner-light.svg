<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F7FF"/>
      <stop offset="100%" stop-color="#EAF0FB"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Bubble cluster — The Bubble Company motif -->
  <circle cx="985"  cy="65"  r="140" fill="none"    stroke="#007A6C" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="1075" cy="175" r="90"  fill="#007A6C" fill-opacity="0.05"  stroke="#007A6C" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="1120" cy="50"  r="55"  fill="#4C5EAB" fill-opacity="0.07"  stroke="#4C5EAB" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="875"  cy="225" r="32"  fill="none"    stroke="#007A6C" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="1158" cy="218" r="46"  fill="none"    stroke="#4C5EAB" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="1055" cy="260" r="20"  fill="#007A6C" fill-opacity="0.10"  stroke="#007A6C" stroke-opacity="0.32" stroke-width="1"/>
  <circle cx="925"  cy="135" r="9"   fill="#007A6C" fill-opacity="0.35"/>
  <circle cx="1135" cy="125" r="6"   fill="#4C5EAB" fill-opacity="0.40"/>
  <circle cx="955"  cy="255" r="7"   fill="#007A6C" fill-opacity="0.30"/>
  <circle cx="1000" cy="200" r="4"   fill="#4C5EAB" fill-opacity="0.38"/>
  <circle cx="1085" cy="105" r="3"   fill="#007A6C" fill-opacity="0.50"/>

  <!-- Code label -->
  <text
    x="60" y="108"
    font-family="'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace"
    font-size="14" font-weight="400"
    fill="#007A6C" letter-spacing="2" opacity="0.90"
  >// CTO &amp; FULL STACK DEVELOPER</text>

  <!-- Name -->
  <text
    x="58" y="171"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="58" font-weight="700"
    fill="#050D1C" letter-spacing="-1.5"
  >Raffaele Tufano</text>

  <!-- Company -->
  <text
    x="62" y="209"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="21" font-weight="400"
    fill="#3B5E80" letter-spacing="0.4"
  >@ The Bubble Company</text>

  <!-- Stack tags -->
  <text
    x="62" y="246"
    font-family="'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace"
    font-size="12" font-weight="400"
    fill="#8AAAC0" letter-spacing="1.5"
  >TypeScript  ·  PHP / Laravel  ·  Flutter  ·  Dart  ·  Cybersecurity</text>

  <!-- Bottom accent line with terminal dot -->
  <rect x="60" y="267" width="380" height="1.5" fill="#007A6C" opacity="0.50" rx="1"/>
  <circle cx="443" cy="267.75" r="3.5" fill="#007A6C" opacity="0.50"/>
</svg>
